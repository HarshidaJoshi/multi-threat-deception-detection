<aside class="sidebar glass" id="sidebar">
  <div class="sidebar-brand">
    <h1>XAI-Verify</h1>
    <p>Explainable AI for DeepFake &amp; Misinformation Detection</p>
  </div>
  <nav class="sidebar-nav">
    <a href="{% url 'dashboard' %}" class="nav-link{% if request.resolver_match.url_name == 'dashboard' %} active{% endif %}">Dashboard</a>
    <a href="{% url 'deepfake_analyze' %}" class="nav-link{% if request.resolver_match.url_name == 'deepfake_analyze' %} active{% endif %}">DeepFake Detection</a>

    <div class="nav-group{% if 'misinformation' in request.path %} is-open{% endif %}" id="misinformationNavGroup">
      <button
        type="button"
        class="nav-group-toggle{% if 'misinformation' in request.path %} active{% endif %}"
        id="misinformationNavToggle"
        aria-expanded="{% if 'misinformation' in request.path %}true{% else %}false{% endif %}"
        aria-controls="misinformationSubmenu"
      >
        <span>Misinformation Detection</span>
        <span class="nav-arrow" aria-hidden="true">▾</span>
      </button>
      <div class="nav-submenu" id="misinformationSubmenu">
        <a href="{% url 'misinformation_fake_news' %}" class="nav-link nav-sublink{% if request.resolver_match.url_name == 'misinformation_fake_news' %} active{% endif %}">Fake News</a>
        <a href="{% url 'misinformation_recruitment_scam' %}" class="nav-link nav-sublink{% if request.resolver_match.url_name == 'misinformation_recruitment_scam' %} active{% endif %}">Recruitment Scam</a>
      </div>
    </div>

    <a href="{% url 'reports_history' %}" class="nav-link{% if 'reports' in request.path or 'history' in request.path %} active{% endif %}">Analysis History</a>
    <a href="{% url 'about' %}" class="nav-link{% if request.resolver_match.url_name == 'about' %} active{% endif %}">About Research</a>
  </nav>
</aside>
